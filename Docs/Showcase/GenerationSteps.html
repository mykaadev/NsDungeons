<!-- Showcase for the website: the docs link to this file, and the site turns the list into a step slider. -->
<figure class="ns-steps">
  <figcaption>Eight steps, one seed (seed 7). Drag the slider, or pick a step.</figcaption>
  <ol>
    <li data-image="img/step1.jpg"><b>Grid</b> A grid of 5 by 5 nodes. Each node can become a room.</li>
    <li data-image="img/step2.jpg"><b>Start and goal</b> A random start, and a goal at least 3 steps away on the grid.</li>
    <li data-image="img/step3.jpg"><b>Major cycle</b> Two routes from the start to the goal that share no room. Random costs bend them, so each seed draws a new loop.</li>
    <li data-image="img/step4.jpg"><b>Cycle type</b> The type puts locks, keys, and one-way doors on the two routes. Seed 7 rolls Lock and Key.</li>
    <li data-image="img/step5.jpg"><b>Side loops</b> A short loop through new rooms. By chance it gets a lock at its entry, a one-way door out, and a key in a room that the party reaches first.</li>
    <li data-image="img/step6.jpg"><b>Hidden shortcut</b> By chance, a secret door between two rooms that touch on the grid but lie far apart on the way.</li>
    <li data-image="img/step7.jpg"><b>Dead ends</b> New rooms grow off the plan until the floor has its target size.</li>
    <li data-image="img/step8.jpg"><b>Resolve</b> The doors from the start for each room, the dead ends, and the room tags of the game, such as Camp or Cache.</li>
  </ol>
</figure>
